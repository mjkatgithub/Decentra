<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="cyanMagenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF"></stop>
      <stop offset="100%" stop-color="#FF00C8"></stop>
    </linearGradient>

    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="coloredBlur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>

    <filter id="glassBlur">
      <feGaussianBlur stdDeviation="15"></feGaussianBlur>
    </filter>

    <filter id="noise">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.8"
        numOctaves="2"
        stitchTiles="stitch"
      ></feTurbulence>
      <feColorMatrix type="saturate" values="0"></feColorMatrix>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"></feFuncA>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="none"></rect>

  <circle
    cx="400"
    cy="400"
    r="260"
    fill="rgba(255,255,255,0.05)"
    stroke="rgba(255,255,255,0.2)"
    stroke-width="2"
    filter="url(#glassBlur)"
  ></circle>

  <g stroke="url(#cyanMagenta)" stroke-width="3" filter="url(#neonGlow)">
    <line x1="200" y1="300" x2="600" y2="250"></line>
    <line x1="600" y1="250" x2="550" y2="600"></line>
    <line x1="550" y1="600" x2="250" y2="550"></line>
    <line x1="250" y1="550" x2="200" y2="300"></line>
    <line x1="200" y1="300" x2="550" y2="600"></line>
    <line x1="600" y1="250" x2="250" y2="550"></line>
  </g>

  <g fill="url(#cyanMagenta)" filter="url(#neonGlow)">
    <circle cx="200" cy="300" r="14"></circle>
    <circle cx="600" cy="250" r="14"></circle>
    <circle cx="550" cy="600" r="14"></circle>
    <circle cx="250" cy="550" r="14"></circle>
  </g>

  <g stroke="url(#cyanMagenta)" stroke-width="2" filter="url(#neonGlow)">
    <line x1="400" y1="320" x2="470" y2="420"></line>
    <line x1="470" y1="420" x2="330" y2="430"></line>
    <line x1="330" y1="430" x2="400" y2="320"></line>
  </g>

  <g fill="url(#cyanMagenta)" filter="url(#neonGlow)">
    <circle cx="400" cy="320" r="10"></circle>
    <circle cx="470" cy="420" r="10"></circle>
    <circle cx="330" cy="430" r="10"></circle>
  </g>

  <rect width="100%" height="100%" filter="url(#noise)"></rect>

  <text
    x="400"
    y="740"
    font-family="Segoe UI, Helvetica, Arial, sans-serif"
    font-size="64"
    text-anchor="middle"
    fill="white"
    letter-spacing="8"
  >
    DECENTRA
  </text>

</svg>
